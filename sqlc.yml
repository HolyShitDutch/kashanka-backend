version: 2

sql:
  - engine: "postgresql"
    queries: "db/sql"
    schema: "db/migrations"
    gen:
      go:
        package: queries
        out: db/queries
        sql_package: pgx/v5
        emit_prepared_queries: true
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true
        emit_pointers_for_null_types: true
        emit_pointers_for_null_enum_types: true
        emit_enum_valid_method: true

        initialisms:
          - id
          - json

        rename:
          credential_json_encrypted: "CredentialJSON"
          display_name_encrypted: "DisplayName"

overrides:
  go:
    overrides:
      - db_type: uuid
        nullable: true
        go_type:
          import: uuid
          type: UUID
          pointer: true

      - db_type: uuid
        go_type:
          import: uuid
          type: UUID

      - db_type: "pg_catalog.timestamp"
        nullable: true
        go_type:
          import: time
          type: "Time"
          pointer: true

      - db_type: "pg_catalog.timestamp"
        go_type:
          import: time
          type: "Time"

      - column: "cards.answers"
        go_type:
          import: github.com/HolyShitDutch/kashanka/internal/dbtypes
          type: "AnswerMap"

      - column: "cards.answer_languages"
        go_type:
          type: "[]string"

      - column: "users.display_name_encrypted"
        go_type:
          import: "github.com/bincyber/go-sqlcrypter"
          type: "EncryptedBytes"

      - column: "webauthn_credentials.credential_json_encrypted"
        go_type:
          import: "github.com/bincyber/go-sqlcrypter"
          type: "EncryptedBytes"
